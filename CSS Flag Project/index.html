<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>CSS Flag Project</title>
        <style>
            .flag{
                width: 900px;
                height: 600px;
                background-color: red;
            }
            .flag>div{
                width: 900px;
                height: 300px;
                background-color: blue;
                position: absolute;
                top: 150px;
            }
            .flag>div>div{
                width: 200px;
                height: 200px;
                background-color: white;
                border-radius: 50%;
                position: absolute;
                top: 50px;
                left: 350px;
            }
            p{
                margin: 0;
                font-size: 5rem;
                text-align: center;
                color: white;
            }
            .flag div div p{
                color: black;
            }
        </style>
    </head>

    <body>
        <div class="flag">
            <p>The Flag</p>
           <div>
            <div>
                <p>Of Laos</p>
            </div>
           </div>
        </div>
    </body>

</html>
